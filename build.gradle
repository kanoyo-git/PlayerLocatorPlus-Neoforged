plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.37'
    id 'org.jetbrains.kotlin.jvm' version '2.1.20'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.1.20'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        java.srcDir 'src/client/java'
        resources.srcDir 'src/client/resources'
    }
}

kotlin {
    sourceSets {
        main.kotlin.srcDir 'src/client/kotlin'
    }
    jvmToolchain(21)
}

runs {
    configureEach {
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neo_version}"

    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.0"
    implementation "org.jetbrains.kotlinx:kotlinx-datetime-jvm:0.7.1-0.6.x-compat"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-core-jvm:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.9.0"
    implementation "com.akuleshov7:ktoml-core-jvm:0.7.1"

    // Bundle the runtime libraries; NeoForge does not provide Fabric Language Kotlin.
    jarJar "org.jetbrains.kotlin:kotlin-stdlib:2.2.0"
    // kotlin-stdlib-jdk8 declares a JPMS requirement on this module at launch.
    jarJar "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.0"
    jarJar "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.0"
    jarJar "org.jetbrains.kotlinx:kotlinx-datetime-jvm:0.7.1-0.6.x-compat"
    jarJar "org.jetbrains.kotlinx:kotlinx-serialization-core-jvm:1.9.0"
    jarJar "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.9.0"
    jarJar "com.akuleshov7:ktoml-core-jvm:0.7.1"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions.jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
    from('NOTICE.md') {
        rename { "NOTICE_${project.archives_base_name}.md" }
    }
}

tasks.named('jarJar').configure {
    archiveClassifier = ''
}

tasks.named('assemble').configure {
    dependsOn tasks.named('jarJar')
}

// NeoGradle adds a JUnit game-run task to `check`.  This project has no test
// sources, so retain the regular JVM test task without starting an empty game
// test server during every package build.
tasks.named('check').configure {
    setDependsOn([tasks.named('test')])
}

tasks.named('test').configure {
    setFinalizedBy([])
}

gradle.projectsEvaluated {
    tasks.named('testJunit').configure {
        enabled = false
        setDependsOn([])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
